trigger:
  batch: true
  branches:
    include:
      - legacy

resources:
  repositories:
    - repository: niveristand-custom-device-build-tools
      type:       github
      ref:        main
      endpoint:   nivs-custom-devices
      name:       ni/niveristand-custom-device-build-tools

stages:
  - template: azure-templates/stages-legacy.yml@niveristand-custom-device-build-tools
    parameters:

      lvVersionsToBuild:         
        - version: '2025'
          bitness: '32bit'
        - version: '2025'
          bitness: '64bit'
        - version: '2026'
          bitness: '32bit'
        - version: '2026'
          bitness: '64bit'

      codegenVis:
        - 'Source\Script FXP Read.vi'
        - 'Source\Script FXP Write.vi'

      buildSteps:
        - projectLocation: 'Source\FXP LLB.lvproj'
          buildOperation: 'ExecuteBuildSpecAllTargets'
          target: 'All'
          buildSpec: 'FXP LLB'

      releaseVersion: '27.0.0'
      buildOutputLocation: 'Built'
      archiveLocation: '\\nirvana\Measurements\VeriStandAddons\legacy\scan_engine_fxp'
      repoName: 'niveristand-scan-engine-fxp-libraries'
      createNetCoreRepo: false
